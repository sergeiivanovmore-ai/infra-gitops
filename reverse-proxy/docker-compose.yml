services:
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro #./data/certbot/www:/var/www/certbot:ro
      - ./auth:/etc/nginx/auth:ro
    networks:
      - vpn-net
      # hermes-net обязателен: в ней апстримы jt-site-prod, hermes-sysadmin,
      # hermes-work, hermes-orchestrator. Без неё nginx умирает на старте с
      # 'host not found in upstream' и уходит в цикл рестарта — ingress ложится.
      - hermes-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  vpn-net:
    external: true
    name: vpn-net
  hermes-net:
    external: true
    name: hermes-net