# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name jt-design.ru www.jt-design.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name jt-design.ru www.jt-design.ru;
    ssl_certificate /etc/letsencrypt/live/jt-design.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jt-design.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Защищённый доступ к Weave Scope ---
    location /scope/ {
        auth_basic "Weave Scope Access";
        auth_basic_user_file /etc/nginx/auth/.htpasswd_scope;

        proxy_pass http://172.17.0.1:4040/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # -------------------------------------

    # --- Основной сайт (статический) ---
    location / {
        proxy_pass http://design-site-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ------------ доступ к панели VPN -----------------
    location /VPN/ {
        proxy_pass http://127.0.0.1:2053/VPN/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


}