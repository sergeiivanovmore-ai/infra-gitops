upstream hermes_dashboard_sysadmin {
    server hermes-sysadmin:9119;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name sysadmin.jt-design.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sysadmin.jt-design.ru;

    ssl_certificate     /etc/letsencrypt/live/sysadmin.jt-design.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysadmin.jt-design.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # auth_basic "Hermes Sysadmin Dashboard";
    # auth_basic_user_file /etc/nginx/auth/hermes-dashboard.htpasswd;

    location / {
        proxy_pass http://hermes_dashboard_sysadmin;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
