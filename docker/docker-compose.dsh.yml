services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      LOGS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      EXEC: "0"
      VOLUMES: "1"
      NETWORKS: "1"
      SYSTEM: "1"
      INFO: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_STOP: "0"
      ALLOW_START: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mcp-network
  dsh:
    build:
      context: .
      dockerfile: Dockerfile.dsh
    image: dsh-node24:latest
    container_name: dsh
    restart: unless-stopped
    group_add:
      - "999"
    shm_size: 512mb
    ports:
      - "127.0.0.1:${DSH_WEB_PORT:-3080}:3080"
    volumes:
      - ./data:/home/dsh/.dsh
      - ./workspace:/home/dsh/workspace
      - /usr/bin/docker:/usr/local/bin/docker:ro
      # ── read-only окно в хост: агент читает конфиги и логи сам, без docker exec ──
      - /opt/docker/reverse-proxy:/host/reverse-proxy:ro
      - /opt/docker/backups:/host/backups:ro
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PLAYWRIGHT_BROWSERS_PATH: /home/dsh/workspace/.pw-browsers
    env_file:
      - .env
    networks:
      - mcp-network
    healthcheck:
      disable: true

networks:
  mcp-network:
    external: true
