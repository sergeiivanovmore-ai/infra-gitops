services:
  docker-socket-proxy:
    image: wollomatic/socket-proxy@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    container_name: docker-socket-proxy
    restart: unless-stopped
    # Образ работает от uid 65534 (nobody). Сокет /var/run/docker.sock принадлежит
    # root:docker с правами 0660, поэтому без группы докера процесс не может его
    # открыть и завершается — контейнер уходит в перезапуск, а dsh теряет доступ.
    # 999 — GID группы докера на этом хосте, тот же, что в group_add у сервиса dsh.
    user: "65534:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    # Разрешительная модель: что не перечислено — запрещено. Запись, exec,
    # перезапуск и остановка контейнеров не разрешаются вообще.
    command:
      - '-listenip=0.0.0.0'
      # К прокси допускается только контейнер dsh. Если при старте имя не
      # разрешится, заменить на диапазон сети: -allowfrom=172.26.0.0/16
      - '-allowfrom=dsh'
    environment:
      # Чтение контейнеров: имена перечислены явно, поэтому hermes-sysadmin
      # недоступен — ни файлы (docker cp: GET /containers/<имя>/archive),
      # ни переменные окружения (docker inspect). Идентификатор контейнера
      # не подходит: он состоит только из шестнадцатеричных знаков и под
      # перечисление имён не подпадает.
      # Новый контейнер добавлять в оба списка: SP_ALLOW_GET и SP_ALLOW_HEAD.
      SP_ALLOW_GET: '(/v[0-9.]+)?/containers/(dsh|hermes-gateway|hermes-orchestrator|hermes-work|nginx-proxy|mail-relay|searxng|searxng-redis|open-websearch|design-site-nginx|jt-site-prod|jt-site-staging|3x-ui|docker-socket-proxy)/(json|logs|stats|top|archive)(\?.*)?'
      # Список контейнеров и служебные сведения самого демона.
      SP_ALLOW_GET_2: '(/v[0-9.]+)?/containers/json(\?.*)?'
      SP_ALLOW_GET_3: '(/v[0-9.]+)?/(version|_ping|events|system/df)(\?.*)?'
      SP_ALLOW_GET_4: '(/v[0-9.]+)?/(images|volumes|networks)(/json)?(\?.*)?'
      SP_ALLOW_GET_5: '(/v[0-9.]+)?/(images|volumes|networks)/.+/json(\?.*)?'
      # docker cp сначала спрашивает метаданные файла методом HEAD — те же имена.
      SP_ALLOW_HEAD: '(/v[0-9.]+)?/(_ping|containers/(dsh|hermes-gateway|hermes-orchestrator|hermes-work|nginx-proxy|mail-relay|searxng|searxng-redis|open-websearch|design-site-nginx|jt-site-prod|jt-site-staging|3x-ui|docker-socket-proxy)/archive)(\?.*)?'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mcp-network
  dsh:
    build:
      context: .
      dockerfile: Dockerfile.dsh
    image: dsh-node24:latest
    container_name: dsh
    restart: unless-stopped
    group_add:
      - "999"
    shm_size: 512mb
    ports:
      - "127.0.0.1:${DSH_WEB_PORT:-3080}:3080"
    volumes:
      - ./data:/home/dsh/.dsh
      - ./workspace:/home/dsh/workspace
      - /usr/bin/docker:/usr/local/bin/docker:ro
      # ── read-only окно в хост: агент читает конфиги и логи сам, без docker exec ──
      - /opt/docker/reverse-proxy:/host/reverse-proxy:ro
      - /opt/docker/backups:/host/backups:ro
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PLAYWRIGHT_BROWSERS_PATH: /home/dsh/workspace/.pw-browsers
    env_file:
      - .env
    networks:
      - mcp-network
    healthcheck:
      disable: true

networks:
  mcp-network:
    external: true