services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      LOGS: "1"
      POST: "0"
      EXEC: "0"
      VOLUMES: "0"
      NETWORKS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mcp-network
  dsh:
    build:
      context: .
      dockerfile: Dockerfile.dsh
    image: dsh-node24:latest
    container_name: dsh
    restart: unless-stopped
    group_add:
      - "999"
    ports:
      - "127.0.0.1:${DSH_WEB_PORT:-3080}:3080"
    volumes:
      - ./data:/home/dsh/.dsh
      - ./workspace:/home/dsh/workspace
      - /usr/bin/docker:/usr/local/bin/docker:ro
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    env_file:
      - .env
    networks:
      - mcp-network
    healthcheck:
      disable: true

networks:
  mcp-network:
    external: true
