services:
  hermes-sysadmin:
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: hermes-sysadmin
    restart: unless-stopped

    # Файлы профиля лежат прямо в /opt/data, поэтому -p не нужен
    command: gateway run

    env_file:
      - ./data/.env

    environment:
      HERMES_WRITE_SAFE_ROOT: /opt/data/workspace:/opt/data/scripts:/opt/data/memories:/opt/data/logs:/opt/data/cron:/tmp

      # --- Включаем Dashboard и разрешаем доступ через ваш домен ---
      HERMES_DASHBOARD: "1"
      # Замените hermes.your-domain.com на ваш реальный домен
      HERMES_DASHBOARD_EXTRA_HOSTS: "sysadmin.jt-design.ru"
      # (Опционально, но рекомендуется) Явно указываем публичный URL
      HERMES_DASHBOARD_PUBLIC_URL: "https://sysadmin.jt-design.ru"

      TELEGRAM_ALLOWED_USERS: "303705842"

    ports:
      - "127.0.0.1:8653:8642"   # gateway (свободен)
      - "127.0.0.1:9121:9119"   # dashboard (свободен; будет проксироваться через 

    volumes:
      - ./data:/opt/data

    networks:
      - hermes-net
      - mcp-network

networks:
  hermes-net:
    external: true
    name: hermes-net
  mcp-network:
    external: true
    name: mcp-network

x-audit:
  enabled: true
