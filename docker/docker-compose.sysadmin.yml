services:
  hermes-sysadmin:
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: hermes-sysadmin
    restart: unless-stopped

    # Файлы профиля лежат прямо в /opt/data, поэтому -p не нужен
    command: gateway run

    env_file:
      - ./data/.env

    environment:
      HERMES_WRITE_SAFE_ROOT: /opt/data/workspace:/opt/data/scripts:/opt/data/memories:/opt/data/logs:/opt/data/cron:/tmp

    ports:
      - "127.0.0.1:8643:8642"   # gateway (не конфликтует с hermes-gateway:8642)
      - "127.0.0.1:9120:9119"   # dashboard (не конфликтует с 9119)

    volumes:
      - ./data:/opt/data

    networks:
      - hermes-net
      - mcp-network

networks:
  hermes-net:
    external: true
    name: hermes-net
  mcp-network:
    external: true
    name: mcp-network
