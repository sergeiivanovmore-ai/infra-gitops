name: Ops (публикация из outbox агента)

# Зачем: у агента нет шелла и выхода в сеть, а запись файлов через GitHub MCP
# идёт через модель (наблюдался огрызок вместо скрипта). Хост же читает workspace
# агента напрямую, поэтому транспорт — файлы. Агент кладёт файл в outbox, а этот
# workflow запускает на хосте scripts/ops-publish.sh, который коммитит его в
# ветку agent/* и пушит. Мерж в main остаётся человеческим.
#
# Триггеры — только человек или расписание. Автозапуск пушем убран по ревью
# безопасности: агент не должен инициировать выполнение сам.
#
# Режим применения деструктивных скриптов включается ТОЛЬКО входным параметром
# approve этого ручного запуска: имя скрипта из outbox сравнивается с ним в
# scripts/ops-publish.sh. У агента нет инструмента запуска workflow, поэтому
# подделать подтверждение он не может — иначе --yes был бы лишь обещанием.
#
# СЛЕД ЗАПУСКА: агент не видит логи Actions (403 даже на публичном репозитории),
# поэтому шаг обязан оставлять след в logs/ops-publish-boot.log из workspace
# агента — и когда публикатор запустился, и когда решил пропустить, вместе с
# причиной пропуска. Иначе отказ на хосте выглядит для агента как «ничего не
# произошло», и разбор превращается в гадание.

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Имя скрипта из outbox/run, которому разрешён режим применения (--yes). Пусто — только план."
        required: false
        default: ""
        type: string
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Хостовый шаг — публикация outbox, запуск заявок и след в логе"
        uses: appleboy/ssh-action@v1
        env:
          OPS_APPROVE: ${{ github.event.inputs.approve }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: OPS_APPROVE
          command_timeout: 5m
          request_pty: false
          capture_stdout: true
          script: |
            LOG=/opt/docker/hermes-sysadmin/data/logs/ops-publish-boot.log
            TS=$(date -Iseconds)
            echo "[$TS] шаг начался: user=$(id -un) uid=$(id -u)" >> "$LOG" 2>&1
            SCRIPT=/opt/infra-gitops/scripts/ops-publish.sh
            if [ -f "$SCRIPT" ]; then
              echo "[$TS] публикатор найден ($(wc -c < "$SCRIPT") байт), запускаю" >> "$LOG" 2>&1
              bash "$SCRIPT"; RC=$?
              echo "[$TS] публикатор завершён rc=$RC" >> "$LOG" 2>&1
            else
              echo "[$TS] ПРОПУСК: $SCRIPT не найден" >> "$LOG" 2>&1
              echo "[$TS] смотрю, что есть на хосте:" >> "$LOG" 2>&1
              ls -la /opt/infra-gitops 2>&1 | head -15 >> "$LOG" 2>&1
              ls -la /opt/infra-gitops/scripts 2>&1 | head -25 >> "$LOG" 2>&1
            fi