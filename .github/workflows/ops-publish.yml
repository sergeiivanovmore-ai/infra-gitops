name: Ops (публикация из outbox агента)

# Зачем: у агента нет шелла и выхода в сеть, а запись через GitHub MCP идёт
# аргументом инструмента (контент набирает модель). Хост же читает workspace
# агента напрямую, поэтому транспорт — файлы. Агент кладёт файл в outbox, а этот
# workflow запускает на хосте публикатор, который коммитит его в ветку agent/* и
# пушит. Мерж в main остаётся человеческим.
#
# Почему шаг — одна строка: рабочая схема деплоя устроена именно так, а попытка
# передать входной параметр через env/envs и многострочный script привела к тому,
# что шаг отчитывался успехом, не выполнив на хосте ничего. Вся логика вынесена в
# scripts/ops-publish-entry.sh — её видно, её можно прочитать и отревьюить, в
# отличие от YAML.
#
# Триггеры — только человек или расписание: агент не должен инициировать
# выполнение сам. Режим применения (--yes) включается ТОЛЬКО через поле approve
# ручного запуска; у агента нет инструмента запуска workflow, поэтому подделать
# подтверждение он не может — иначе --yes было бы лишь обещанием.
#
# След запуска: агент не видит логи Actions (403 даже на публичном репозитории),
# поэтому входная точка пишет след в logs/ops-publish-boot.log из workspace
# агента и дублирует его в вывод шага.

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Имя скрипта из outbox/run, которому разрешён режим применения (--yes). Пусто — только план."
        required: false
        default: ""
        type: string
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Ops publish via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: bash /opt/infra-gitops/scripts/ops-publish-entry.sh "${{ github.event.inputs.approve }}"
          command_timeout: 5m
          request_pty: false
          capture_stdout: true