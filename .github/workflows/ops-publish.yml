name: Ops (публикация из outbox агента)

# Зачем: у агента нет шелла и выхода в сеть, а запись файлов через GitHub MCP
# идёт через модель и может исказить содержимое. Хост же читает workspace агента
# напрямую, поэтому транспорт — файлы, а не модель. Агент кладёт файл в outbox
# (свой workspace), а этот workflow запускает на хосте scripts/ops-publish.sh,
# который коммитит его в ветку и пушит. Мерж остаётся человеческим.
#
# Триггеры: расписание (страховка), вручную кнопкой и пуш в ветку ops/** —
# последнее даёт агенту возможность запустить публикацию самому, сразу.

on:
  workflow_dispatch:
  push:
    branches:
      - 'ops/**'
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Хостовый шаг — публикация outbox и запуск заявок"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: bash /opt/infra-gitops/scripts/ops-publish.sh
          command_timeout: 5m
          request_pty: false
          capture_stdout: true