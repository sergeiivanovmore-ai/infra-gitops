name: Deploy Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # ночная сходимость: деплой идемпотентен и merge-gated, отдельный крон на
    # хосте не нужен. 03:17 UTC — тихий час, вне окна правок.
    - cron: '17 3 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: AUDIT_MODE=enforce /usr/local/bin/deploy-infra.sh
          command_timeout: 10m
          request_pty: false
          capture_stdout: true
