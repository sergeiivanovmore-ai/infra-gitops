name: Diagnose Infrastructure

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Диагностика и публикация отчёта (на хосте)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: bash /opt/infra-gitops/scripts/publish-diag.sh
          command_timeout: 5m
          request_pty: false
          capture_stdout: true

      - name: Проверить свежесть отчёта и тревоги
        run: |
          mkdir -p reports
          if ! curl -sSf -m 30 -o reports/latest.md https://raw.githubusercontent.com/sergeiivanovmore-ai/infra-gitops/reports/diag/reports/latest.md; then
            echo "::error::Отчёт не читается из ветки reports/diag — публикация с хоста не сработала"
            exit 1
          fi
          if ! grep -q '^# Инфра-отчёт' reports/latest.md; then
            echo "::error::Файл в ветке не похож на отчёт диагностики"
            exit 1
          fi
          stamp=$(sed -n 's/^Снят: //p' reports/latest.md | head -1)
          echo "отчёт снят: $stamp"
          if [ -n "$stamp" ]; then
            age=$(( ( $(date -u +%s) - $(date -u -d "$stamp" +%s) ) / 60 ))
            echo "возраст отчёта: $age мин"
            if [ "$age" -gt 360 ]; then
              echo "::error::Отчёт устарел ($age мин) — ветка reports/diag не обновляется"
              exit 1
            fi
          fi
          if awk '/^## ТРЕВОГИ/{f=1;next} f&&/^- /{print; found=1} END{exit !found}' reports/latest.md; then
            echo "::error::В отчёте есть тревоги — подробности в ветке reports/diag"
            exit 1
          fi
          echo "отчёт свежий, тревог нет"