# Фаза 2 — TLS. Применять ТОЛЬКО после успешного выпуска сертификата:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d <domain> --cert-name <domain> --key-type ecdsa --agree-tos --no-eff-email
# Если хостовый certbot сломан — через docker-образ certbot/certbot (см. SKILL.md грабли #4).
# Схема подключения TLS скопирована с уже работающего conf.d репозитория
# (options-ssl-nginx.conf + ssl-dhparams.pem) — не плодить варианты.

# 80: ACME + редирект на HTTPS
server {
    listen 80;
    server_name <domain>;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443: HTTPS
server {
    listen 443 ssl;
    server_name <domain>;

    ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://<service>:<port>;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
