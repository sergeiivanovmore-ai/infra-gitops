# Этот файл — источник истины для группы mcp_servers агента hermes-sysadmin
# Применяется скриптом scripts/apply-agent-settings.sh из публикатора
# Меняйте только через PR
# Откат — верните прежнее содержимое этого файла
#
# ВНИМАНИЕ: применение заменяет группу mcp_servers целиком — перечислять все
# серверы этого агента.
#
# Секрет здесь — только плейсхолдер. Значение DSH_MCP_TOKEN лежит в
# /opt/docker/hermes-sysadmin/data/.env и в репозиторий не попадает.
# Имя сервера у этого агента — dsh (не dsh-carrot): доступ намеренно узкий
# (trust: full плюс перечисленные ниже инструменты моста). Переименовывать не
# нужно, это не алиас, а другое по смыслу подключение.
#
# Список инструментов рассчитан на мост dsh-rice-on-a-stick 0.2.x: имени
# agent_run там больше нет, запуск сессии выражается парой session_create +
# session_prompt, очередь — session_submit/session_poll/session_result.
# При смене линии моста список проверять заново: несуществующие имена молча
# отсекаются фильтром, и агент остаётся вообще без инструментов моста.

mcp_servers:
  dsh:
    url: http://dsh:8090/mcp
    transport: http
    trust: full
    timeout: 900
    headers:
      Authorization: "Bearer ${DSH_MCP_TOKEN}"
    tools:
      include:
        - session_create
        - session_prompt
        - session_submit
        - session_poll
        - session_result
        - session_cancel
        - session_list
        - session_history
        - dsh_status
        - approval_list
        - approval_answer