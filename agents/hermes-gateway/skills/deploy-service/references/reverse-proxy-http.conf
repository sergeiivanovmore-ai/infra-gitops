# Фаза 1 — только HTTP. Нужна, чтобы nginx отвечал на ACME-challenge и certbot
# смог выпустить сертификат. TLS добавляется отдельным PR после выпуска.
server {
    listen 80;
    server_name <domain>;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://<service>:<port>;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # обязательно для WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
