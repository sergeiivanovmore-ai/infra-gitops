# Модель агента hermes-orchestrator (строит сайт).
kind: hermes
config: /opt/docker/hermes-orchestrator/data/config.yaml
restart: hermes-orchestrator
model_provider: openrouter
model_default: deepseek/deepseek-v4.1-flash
