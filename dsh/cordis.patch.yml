# Id-targeted config override for the bundled dsh-rice-on-a-stick entry.
# Do NOT use "insert:" here — that creates a duplicate entry.
- id: dsh-rice-on-a-stick
  name: 'dsh-rice-on-a-stick'
  config:
    http: true
    port: 8090
    host: 0.0.0.0
    authEnabled: true
    authToken: !!js 'process.env.MCP_DSH_RICE_TOKEN'
    selfToolsEnabled: false
    allowedHosts:
      - "dsh"
      - "dsh:8090"
      - "hermes-sysadmin"
      - "hermes-gateway"
      - "172.26.0.0/16"

- id: mcp-github
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: github
    transport: streamable-http
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: !!js '`Bearer ${process.env.GITHUB_TOKEN}`'
    failOnStartupError: false