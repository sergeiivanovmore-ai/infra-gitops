# Id-targeted config override for the bundled dsh-rice-on-a-stick entry.
# Do NOT use "insert:" here — that creates a duplicate entry.
- id: dsh-rice-on-a-stick
  name: 'dsh-rice-on-a-stick'
  config:
    http: true
    port: 8090
    host: 0.0.0.0
    authEnabled: true
    authToken: !!js 'process.env.MCP_DSH_RICE_TOKEN'
    selfToolsEnabled: false
    # Разрешена единственная модель: вызов с любой другой отклоняется явной ошибкой
    # со списком (плагин, assertModelAllowed). Формат элемента — provider/model.
    allowedModels:
      - openrouter/minimax/minimax-m3.1-flash
    allowedModelsEnabled: true
    allowedHosts:
      - "dsh"
      - "dsh:8090"
      - "hermes-sysadmin"
      - "hermes-gateway"
      - "172.26.0.0/16"

- id: mcp-github
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: github
    transport: streamable-http
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: !!js '`Bearer ${process.env.GITHUB_TOKEN}`'
    failOnStartupError: false
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models:
          - id: nvidia/nemotron-3-ultra-550b-a55b:free
          - id: nvidia/nemotron-3-super-120b-a12b:free
          - id: minimax/minimax-m2.7:free
          - id: xiaomi/mimo-v2-flash:free
          - id: stepfun/step-3.5-flash:free
          - id: deepseek/deepseek-v4-flash
          - id: minimax/minimax-m3.1-flash
          - id: deepseek/deepseek-v3.2
          - id: z-ai/glm-5.3-flash
          - id: qwen/qwen3-next-80b-a3b-instruct
          - id: minimax/minimax-m2.7
          - id: xiaomi/mimo-v2-flash
          - id: stepfun/step-3.5-flash
          - id: inclusionai/ling-2.6-flash
          - id: z-ai/glm-5-turbo
          - id: qwen/qwen3.6-plus
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: openrouter
    model: minimax/minimax-m3.1-flash